
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Mega Burger | Cardápio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: #1b1b1b;
      padding: 25px 15px;
      text-align: center;
      border-bottom: 3px solid #ffc400;
    }

    header h1 {
      color: #ffc400;
      font-size: 32px;
    }

    header p {
      color: #ddd;
      margin-top: 8px;
    }

    .banner {
      text-align: center;
      padding: 30px 15px;
      background: linear-gradient(120deg, #292929, #111);
    }

    .banner h2 {
      color: #ffc400;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .categorias {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 20px 10px;
    }

    .categorias button {
      background: #292929;
      color: white;
      border: 1px solid #ffc400;
      padding: 11px 17px;
      border-radius: 20px;
      cursor: pointer;
    }

    .categorias button.active,
    .categorias button:hover {
      background: #ffc400;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    .titulo {
      color: #ffc400;
      margin: 25px 0 15px;
      font-size: 23px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .produto {
      background: #202020;
      border-radius: 13px;
      overflow: hidden;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
    }

    .produto img {
      width: 100%;
      height: 190px;
      object-fit: contain;
      background: #fff;
      padding: 10px;
    }

    .produto-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .produto h3 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .produto p {
      color: #bbb;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .preco {
      color: #ffc400;
      font-size: 21px;
      font-weight: bold;
      margin-top: auto;
      margin-bottom: 12px;
    }

    .produto button,
    .finalizar {
      background: #ffc400;
      color: #111;
      border: none;
      padding: 12px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .produto button:hover,
    .finalizar:hover {
      background: #e5b000;
    }

    .carrinho {
      background: #202020;
      padding: 20px;
      margin: 35px 0;
      border-radius: 12px;
      border: 1px solid #ffc400;
    }

    .carrinho h2 {
      color: #ffc400;
      margin-bottom: 15px;
    }

    .item-carrinho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #444;
    }

    .item-carrinho button {
      padding: 5px 10px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      margin-left: 3px;
    }

    .total {
      font-size: 22px;
      color: #ffc400;
      font-weight: bold;
      margin: 20px 0;
    }

    .vazio {
      color: #aaa;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #aaa;
      background: #1b1b1b;
      margin-top: 30px;
    }

    @media(max-width: 500px) {
      header h1 {
        font-size: 27px;
      }

      .item-carrinho {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍔 MEGA BURGER</h1>
  <p>O sabor que você merece!</p>
</header>

<section class="banner">
  <h2>Nosso Cardápio</h2>
  <p>Escolha seus favoritos e faça seu pedido pelo WhatsApp.</p>
</section>

<nav class="categorias">
  <button class="active" onclick="filtrar('todos', this)">Todos</button>
  <button onclick="filtrar('hamburguer', this)">Hambúrgueres</button>
  <button onclick="filtrar('porcao', this)">Porções</button>
  <button onclick="filtrar('refrigerante', this)">Refrigerantes</button>
</nav>

<main class="container">
  <h2 class="titulo">🍔 Hambúrgueres</h2>
  <section class="produtos" id="hamburgueres"></section>

  <h2 class="titulo">🍟 Porções</h2>
  <section class="produtos" id="porcoes"></section>

  <h2 class="titulo">🥤 Refrigerantes</h2>
  <section class="produtos" id="refrigerantes"></section>

  <section class="carrinho">
    <h2>🛒 Seu pedido</h2>
    <div id="itens-carrinho">
      <p class="vazio">Seu carrinho está vazio.</p>
    </div>
    <div class="total" id="total">Total: R$ 0,00</div>
    <button class="finalizar" onclick="finalizarPedido()">
      Finalizar pedido pelo WhatsApp
    </button>
  </section>
</main>

<footer>
  <p>MEGA BURGER © 2026 - Todos os direitos reservados.</p>
</footer>

<script>
  // Número de WhatsApp da loja
  const WHATSAPP = "5544999117660";

  // Imagens ilustrativas dos produtos.
  // Os refrigerantes estão separados por tamanho e embalagem.
  const produtos = [
    {
      id: 1,
      nome: "Mega Cheddar",
      descricao: "Hambúrguer, cheddar, queijo e molho especial.",
      preco: 25,
      categoria: "hamburguer",
      imagem: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"
    },
    {
      id: 2,
      nome: "X-Bacon",
      descricao: "Hambúrguer artesanal, bacon e queijo.",
      preco: 28,
      categoria: "hamburguer",
      imagem: "https://images.unsplash.com/photo-1553979459-d2229ba7433a?w=600"
    },
    {
      id: 3,
      nome: "Burger Clássico",
      descricao: "Pão, carne, queijo, alface e tomate.",
      preco: 22,
      categoria: "hamburguer",
      imagem: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"
    },
    {
      id: 4,
      nome: "Batata Frita",
      descricao: "Porção de batata frita crocante.",
      preco: 18,
      categoria: "porcao",
      imagem: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600"
    },
    {
      id: 5,
      nome: "Anéis de Cebola",
      descricao: "Porção de onion rings crocantes.",
      preco: 20,
      categoria: "porcao",
      imagem: "https://images.unsplash.com/photo-1639024471283-03518883512d?w=600"
    },

    // REFRIGERANTES DE 2 LITROS
    {
      id: 6,
      nome: "Coca-Cola 2 Litros",
      descricao: "Garrafa PET de Coca-Cola 2L.",
      preco: 14,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600"
    },
    {
      id: 7,
      nome: "Guaraná Antarctica 2 Litros",
      descricao: "Garrafa PET de Guaraná 2L.",
      preco: 12,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600"
    },
    {
      id: 8,
      nome: "Fanta Laranja 2 Litros",
      descricao: "Garrafa PET de Fanta Laranja 2L.",
      preco: 12,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600"
    },
    {
      id: 9,
      nome: "Pepsi 2 Litros",

      preco: 12,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600"
    },

    // REFRIGERANTES DE 1 LITRO
    {
      id: 10,
      nome: "Coca-Cola 1 Litro",
      descricao: "Garrafa PET de Coca-Cola 1L.",
      preco: 9,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600"
    },
    {
      id: 11,
      nome: "Guaraná Antarctica 1 Litro",
      descricao: "Garrafa PET de Guaraná 1L.",
      preco: 8,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600"
    },

    // REFRIGERANTES DE 600 ML
    {
      id: 12,
      nome: "Coca-Cola 600 ml",
      descricao: "Garrafa PET de Coca-Cola 600ml.",
      preco: 7,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600"
    },
    {
      id: 13,
      nome: "Sprite 600 ml",
      descricao: "Garrafa PET de Sprite 600ml.",
      preco: 7,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600"
    },
    {
      id: 14,
      nome: "Fanta Laranja 600 ml",
      descricao: "Garrafa PET de Fanta 600ml.",
      preco: 7,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600"
    },

    // REFRIGERANTES EM LATA DE 350 ML
    {
      id: 15,
      nome: "Coca-Cola Lata 350 ml",
      descricao: "Lata de Coca-Cola 350ml.",
      preco: 6,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600"
    },
    {
      id: 16,
      nome: "Guaraná Lata 350 ml",
      descricao: "Lata de Guaraná 350ml.",
      preco: 5,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600"
    },
    {
      id: 17,
      nome: "Fanta Laranja Lata 350 ml",
      descricao: "Lata de Fanta Laranja 350ml.",
      preco: 5,
      categoria: "refrigerante",
      imagem: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600"
    }
  ];

  let carrinho = [];

  function criarProduto(produto) {
    const card = document.createElement("article");
    card.className = "produto";
    card.dataset.categoria = produto.categoria;

    const img = document.createElement("img");
    img.src = produto.imagem;
    img.alt = produto.nome;
    img.loading = "lazy";
    img.onerror = function() {
      this.onerror = null;
      this.src = "https://placehold.co/600x400?text=" +
        encodeURIComponent(produto.nome);
    };

    const info = document.createElement("div");
    info.className = "produto-info";

    const nome = document.createElement("h3");
    nome.textContent = produto.nome;

    const descricao = document.createElement("p");
    descricao.textContent = produto.descricao;

    const preco = document.createElement("div");
    preco.className = "preco";
    preco.textContent = produto.preco.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

    const botao = document.createElement("button");
    botao.textContent = "Adicionar ao pedido";
    botao.onclick = () => adicionarCarrinho(produto.id);

    info.append(nome, descricao, preco, botao);
    card.append(img, info);

    return card;
  }

  function carregarProdutos() {
    produtos.forEach(produto => {
      const card = criarProduto(produto);

      if (produto.categoria === "hamburguer") {
        document.getElementById("hamburgueres").appendChild(card);
      } else if (produto.categoria === "porcao") {
        document.getElementById("porcoes").appendChild(card);
      } else {
        document.getElementById("refrigerantes").appendChild(card);
      }
    });
  }

  function filtrar(categoria, botao) {
    document.querySelectorAll(".categorias button").forEach(btn => {
      btn.classList.remove("active");
    });

    botao.classList.add("active");

    document.querySelectorAll(".produto").forEach(card => {
      card.style.display =
        categoria === "todos" || card.dataset.categoria === categoria
          ? "flex"
          : "none";
    });

    document.querySelectorAll(".titulo").forEach(titulo => {
      titulo.style.display = categoria === "todos" ? "block" : "none";
    });

    if (categoria !== "todos") {
      const nomes = {
        hamburguer: "hamburgueres",
        porcao: "porcoes",
        refrigerante: "refrigerantes"
      };

      document.getElementById(nomes[categoria]).previousElementSibling.style.display = "block";
    }
  }

  function adicionarCarrinho(id) {
    const item = carrinho.find(produto => produto.id === id);

    if (item) {
      item.quantidade++;
    } else {
      const produto = produtos.find(produto => produto.id === id);
      carrinho.push({...produto, quantidade: 1});
    }

    atualizarCarrinho();
  }

  function alterarQuantidade(id, alteracao) {
    const item = carrinho.find(produto => produto.id === id);

    if (!item) return;

    item.quantidade += alteracao;

    if (item.quantidade <= 0) {
      carrinho = carrinho.filter(produto => produto.id !== id);
    }

    atualizarCarrinho();
  }

  function atualizarCarrinho() {
    const area = document.getElementById("itens-carrinho");
    area.innerHTML = "";

    if (carrinho.length === 0) {
      area.innerHTML = '<p class="vazio">Seu carrinho está vazio.</p>';
    }

    carrinho.forEach(item => {
      const linha = document.createElement("div");
      linha.className = "item-carrinho";

      const nome = document.createElement("span");
      nome.textContent = item.nome + " x " + item.quantidade;

      const subtotal = document.createElement("span");
      subtotal.textContent = (item.preco * item.quantidade).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });

      const controles = document.createElement("div");

      const menos = document.createElement("button");
      menos.textContent = "−";
      menos.onclick = () => alterarQuantidade(item.id, -1);

      const mais = document.createElement("button");
      mais.textContent = "+";
      mais.onclick = () => alterarQuantidade(item.id, 1);

      controles.append(menos, mais);
      linha.append(nome, subtotal, controles);
      area.appendChild(linha);
    });

    const total = carrinho.reduce(
      (soma, item) => soma + item.preco * item.quantidade, 0
    );

    document.getElementById("total").textContent =
      "Total: " + total.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
  }

  function finalizarPedido() {
    if (carrinho.length === 0) {
      alert("Adicione algum produto ao carrinho primeiro!");
      return;
    }

    let mensagem = "Olá! Gostaria de fazer este pedido:%0A%0A";

    carrinho.forEach(item => {
      mensagem +=
        encodeURIComponent(item.nome + " x " + item.quantidade) +
        "%20-%20" +
        encodeURIComponent(
          (item.preco * item.quantidade).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
          })
        ) + "%0A";
    });

    const total = carrinho.reduce(
      (soma, item) => soma + item.preco * item.quantidade, 0
    );

    mensagem += "%0A" + encodeURIComponent(
      "Total: " + total.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      })
    );

    window.open(
      "https://wa.me/" + WHATSAPP + "?text=" + mensagem,
      "_blank"
    );
  }

  carregarProdutos();
  atualizarCarrinho();
</script>

</body>
</html>
